name: Archie cloud archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * *"

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backup_tool/cloud/requirements.txt

      - name: Restore previous archive
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          python backup_tool/cloud/cloud_sync.py download             --output /tmp/archie-backup.zip             --dropbox /Archie/latest/archie-backup.zip
      - name: Unpack previous archive
        run: |
          if [ -f /tmp/archie-backup.zip ]; then
            mkdir -p backup
            unzip -q -o /tmp/archie-backup.zip -d backup
          fi

      - name: Archive all currently discoverable chapters
        env:
          IFREEDOM_COOKIE_HEADER: ${{ secrets.IFREEDOM_COOKIE_HEADER }}
        run: |
          python backup_tool/cloud/backup.py             --start 1             --end 10000             --output backup             --delay 1             --max-pages 300

      - name: Package archive
        run: |
          cd backup
          zip -q -r ../archie-backup.zip .
          cd ..
          sha256sum archie-backup.zip

      - name: Upload to Dropbox and Google Drive
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          python backup_tool/cloud/cloud_sync.py upload             --local archie-backup.zip             --name archie-backup.zip             --dropbox /Archie/latest/archie-backup.zip
          python backup_tool/cloud/cloud_sync.py upload             --local backup/manifest.json             --name manifest.json             --dropbox /Archie/latest/manifest.json
      - name: Keep a short-lived GitHub copy
        uses: actions/upload-artifact@v4
        with:
          name: archie-latest
          path: |
            archie-backup.zip
            backup/manifest.json
          retention-days: 7
