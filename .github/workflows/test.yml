name: Test backup tool

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backup_tool/local/requirements.txt
      - run: python -m py_compile backup_tool/local/backup.py backup_tool/local/browser_backup.py backup_tool/local/gui.py
      - run: cd backup_tool/local && python -m unittest discover -s tests -v
      - run: python backup_tool/local/backup.py --help
